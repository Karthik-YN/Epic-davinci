<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Epic Davinci — Challenge Tracker</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
</head>
<body>
  <div id="app">
    <!-- ===== SIDEBAR (desktop) ===== -->
    <nav id="sidebar" aria-label="Main navigation">
      <!-- Logo / branding -->
      <div class="sidebar-logo">
        <svg class="logo-icon" viewBox="0 0 32 32" width="36" height="36" aria-hidden="true">
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8b5cf6"/>
              <stop offset="1" stop-color="#ec4899"/>
            </linearGradient>
          </defs>
          <circle cx="16" cy="16" r="15" fill="url(#logo-grad)"/>
          <path d="M10 16l4 4 8-8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="sidebar-app-name">Epic Davinci</div>
          <div class="sidebar-subtitle">Challenge Tracker</div>
        </div>
      </div>

      <!-- Active challenge (rendered by sidebar.js) -->
      <div id="sidebar-challenge" class="sidebar-challenge"></div>

      <!-- Nav links -->
      <ul class="sidebar-nav" role="list">
        <li>
          <a href="#challenges" class="nav-link" data-page="challenges" aria-label="Challenges">
            <!-- Flag icon -->
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
              <line x1="4" y1="22" x2="4" y2="15"/>
            </svg>
            <span>Challenges</span>
          </a>
        </li>
        <li>
          <a href="#dashboard" class="nav-link" data-page="dashboard" aria-label="Dashboard">
            <!-- Home icon -->
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="#daily-log" class="nav-link" data-page="daily-log" aria-label="Daily Log">
            <!-- Pencil icon -->
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            <span>Daily Log</span>
          </a>
        </li>
        <li>
          <a href="#calendar" class="nav-link" data-page="calendar" aria-label="Calendar">
            <!-- Calendar icon -->
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>Calendar</span>
          </a>
        </li>
        <li>
          <a href="#trends" class="nav-link" data-page="trends" aria-label="Trends">
            <!-- Chart / trends icon -->
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            <span>Trends</span>
          </a>
        </li>
        <li>
          <a href="#final-review" class="nav-link" data-page="final-review" aria-label="Final Review">
            <!-- Trophy icon -->
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="8 21 8 14 12 14 12 21"/>
              <path d="M12 14V7"/>
              <path d="M8 7H5a2 2 0 0 1 0-4h14a2 2 0 0 1 0 4h-3"/>
              <line x1="6" y1="21" x2="18" y2="21"/>
              <path d="M5 7c0 4 3 7 7 7s7-3 7-7"/>
            </svg>
            <span>Final Review</span>
          </a>
        </li>
        <li>
          <a href="#settings" class="nav-link" data-page="settings" aria-label="Settings">
            <!-- Gear icon -->
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Settings</span>
          </a>
        </li>
      </ul>

      <!-- Priorities & notes for the active challenge (rendered by sidebar.js) -->
      <section id="sidebar-notes" class="sidebar-notes" aria-label="Challenge priorities and notes"></section>
    </nav>

    <!-- Mobile: backdrop behind the sidebar drawer -->
    <div id="sidebar-backdrop" aria-hidden="true"></div>

    <!-- ===== TOP BAR (mobile) ===== -->
    <header id="mobile-topbar">
      <a href="#challenges" class="nav-link mobile-challenge-link" data-page="challenges" aria-label="Switch challenge">
        <span class="mobile-challenge-label">Challenge</span>
        <span id="mobile-challenge-name">Epic Davinci</span>
      </a>
      <button type="button" id="mobile-notes-btn" class="btn btn-sm btn-secondary" aria-label="Show priorities and notes">📌 Notes</button>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main id="main-content" aria-live="polite" aria-atomic="false">
      <!-- Page content rendered here by JS router -->
      <div class="page-loading">
        <div class="spinner" aria-label="Loading..."></div>
      </div>
    </main>

    <!-- ===== BOTTOM NAV (mobile) ===== -->
    <nav id="bottom-nav" aria-label="Mobile navigation">
      <a href="#dashboard" class="bottom-nav-item nav-link" data-page="dashboard" aria-label="Dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Home</span>
      </a>
      <a href="#daily-log" class="bottom-nav-item nav-link" data-page="daily-log" aria-label="Daily Log">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        <span>Log</span>
      </a>
      <a href="#calendar" class="bottom-nav-item nav-link" data-page="calendar" aria-label="Calendar">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Calendar</span>
      </a>
      <a href="#trends" class="bottom-nav-item nav-link" data-page="trends" aria-label="Trends">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span>Trends</span>
      </a>
      <a href="#final-review" class="bottom-nav-item nav-link" data-page="final-review" aria-label="Final Review">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="8 21 8 14 12 14 12 21"/>
          <path d="M12 14V7"/>
          <path d="M8 7H5a2 2 0 0 1 0-4h14a2 2 0 0 1 0 4h-3"/>
          <line x1="6" y1="21" x2="18" y2="21"/>
          <path d="M5 7c0 4 3 7 7 7s7-3 7-7"/>
        </svg>
        <span>Review</span>
      </a>
      <a href="#settings" class="bottom-nav-item nav-link" data-page="settings" aria-label="Settings">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>

  <!-- ===== TOAST NOTIFICATION CONTAINER ===== -->
  <div id="toast-container" aria-live="polite" aria-label="Notifications"></div>

  <!-- ===== SAVE STATUS INDICATOR ===== -->
  <div id="save-status" aria-live="polite" hidden></div>

  <!-- ===== CONFIRMATION MODAL ===== -->
  <div id="confirm-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title" hidden>
    <div class="modal-overlay" id="confirm-modal-overlay"></div>
    <div class="modal-box">
      <h2 id="confirm-modal-title" class="modal-title">Confirm</h2>
      <p id="confirm-modal-message" class="modal-message"></p>
      <div class="modal-actions">
        <button id="confirm-modal-cancel" class="btn btn-secondary">Cancel</button>
        <button id="confirm-modal-ok" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
